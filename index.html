<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Maintenance — Yusuf Ayman</title>
  <meta name="description" content="Yusuf Ayman's portfolio is currently under maintenance and will be back online soon.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070d1d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#070d1d;--text:#f7f9ff;--muted:#b9c5e2;--line:rgba(133,158,255,.55)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse 42% 35% at 0% 0%,rgba(53,76,219,.78) 0%,rgba(30,43,128,.48) 34%,transparent 72%),radial-gradient(ellipse 37% 34% at 100% 100%,rgba(47,56,201,.72) 0%,rgba(31,42,132,.35) 35%,transparent 73%),linear-gradient(135deg,var(--bg) 0%,#090f20 48%,#060b19 100%);overflow:hidden}
    .page{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;isolation:isolate;padding:48px 24px}.page:before,.page:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:-1}.page:before{top:-305px;left:-170px;background:rgba(53,76,219,.55)}.page:after{right:-180px;bottom:-300px;background:rgba(47,56,201,.58)}
    .maintenance{width:min(920px,100%);text-align:center;transform:translateY(-1vh);animation:pageIn .8s ease both}.illustration{width:min(500px,78vw);height:auto;display:block;margin:0 auto 30px;filter:drop-shadow(0 22px 28px rgba(0,0,0,.28));animation:float 5s ease-in-out infinite}
    h1{margin:0;font-family:Poppins,Inter,sans-serif;font-size:clamp(48px,7vw,76px);line-height:1.05;letter-spacing:-2.8px;font-weight:800}h1 .accent{background:linear-gradient(100deg,#38a9ff 0%,#557ef5 45%,#9a5bea 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{max-width:650px;margin:38px auto 0;color:var(--muted);font-size:clamp(16px,2vw,20px);line-height:1.8}.divider{display:flex;align-items:center;justify-content:center;gap:22px;margin:38px auto 30px;width:min(300px,70vw)}.divider span{display:block;height:2px;flex:1;background:var(--line);border-radius:99px;box-shadow:0 0 10px rgba(83,126,255,.22)}.gear{width:34px;height:34px;display:grid;place-items:center;color:#328fff;font-size:31px;line-height:1;animation:spin 7s linear infinite;text-shadow:0 0 20px rgba(50,143,255,.4)}.thanks{margin:0;color:#c2cde7;font-size:16px;font-weight:500}.back{display:inline-flex;margin-top:30px;color:#8dbbff;text-decoration:none;font-size:14px;opacity:.8;transition:opacity .2s ease,transform .2s ease}.back:hover{opacity:1;transform:translateY(-1px)}
    @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(-1vh)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.page{padding:28px 18px}.maintenance{transform:none}.illustration{margin-bottom:22px;width:min(430px,88vw)}h1{letter-spacing:-1.8px}.lead{margin-top:24px;line-height:1.65}.divider{margin-top:28px;margin-bottom:24px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="maintenance" aria-labelledby="title">
      <img class="illustration" src="maintenance-illustration.svg" alt="Laptop and construction equipment illustration">
      <h1 id="title">Under <span class="accent">Maintenance</span></h1>
      <p class="lead">I’m currently making some improvements to my portfolio.<br>It will be back online soon!</p>
      <div class="divider" aria-hidden="true"><span></span><div class="gear">⚙</div><span></span></div>
      <p class="thanks">Thanks for your patience!</p>
      <a class="back" href="mailto:engyusufayman@gmail.com">Need to reach me? Email me</a>
    </section>
  </main>
</body>
</html>
